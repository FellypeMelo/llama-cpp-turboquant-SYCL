name: TurboQuant+ gates

# Correctness gates, split by what the runner can actually do.
#
#   static     - hosted, ~1 min, runs on everything. Catches the class of defect that has actually
#                shipped in this fork: invariants kept in sync by a comment instead of by a tool.
#   gpu-gates  - self-hosted with an Intel Arc. The golden numeric parity test and the e2e coherence
#                gate are the only things that can prove a turbo change is correct, and neither can
#                run on a GitHub-hosted runner because there is no Intel GPU there.
#   quality    - self-hosted, manual or nightly. Perplexity is slow and needs wikitext-2 plus the
#                reference model, so it does not belong in the per-push path.
#
# The GPU jobs are gated on the repository variable HAS_ARC_RUNNER so that the workflow degrades to
# "static only" instead of queueing forever against a runner label that does not exist. Set
# HAS_ARC_RUNNER=true and give the runner the label `arc-b580` to switch them on.

on:
  push:
    branches:
      - feature/**
      - sync/**
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly, 04:00 UTC. Only the quality job keys off this.
    - cron: '0 4 * * *'

concurrency:
  group: tqp-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: FA dispatch lockstep
        # Three places have to agree about which KV type pairs are dispatchable. A drift between the
        # prefill shim and the curated decode table means prefill succeeds and the abort lands on
        # the first decode token, after the whole prompt was processed. That bug has shipped here
        # before and was caught by review, not by a test.
        run: python3 scripts/check-fattn-lockstep.py

      - name: ASCII only in changed code
        # AGENTS.md requires ASCII in code. Scoped to files this change actually touches: the
        # upstream tree carries pre-existing non-ASCII that is not ours to churn, and a gate that
        # is red on arrival gets ignored. Prose docs are exempt on purpose - they contain accented
        # Portuguese by design.
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base=$(git merge-base origin/${{ github.base_ref }} HEAD)
          else
            base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          changed=$(git diff --name-only --diff-filter=d "$base" HEAD \
                    | grep -E '\.(c|h|cpp|hpp|sh|py)$' || true)
          if [ -z "$changed" ]; then echo "no code files changed"; exit 0; fi
          bad=0
          for f in $changed; do
            [ -f "$f" ] || continue
            if LC_ALL=C grep -nP '[^\x00-\x7F]' "$f" > /tmp/hits 2>/dev/null; then
              echo "non-ASCII in $f:"; head -5 /tmp/hits; bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo ""
            echo "Use - -> x ... instead of em-dash, unicode arrows, multiplication sign, ellipsis."
            exit 1
          fi
          echo "OK: no non-ASCII in the changed code files"

      - name: Shell scripts parse
        run: |
          set -euo pipefail
          for f in $(git ls-files 'tests/*.sh' 'scripts/*.sh'); do
            bash -n "$f" || { echo "syntax error in $f"; exit 1; }
          done
          echo "OK: all shell scripts parse"

      - name: Gate scripts degrade instead of crashing
        # A gate that dies on a missing dependency is indistinguishable from a gate that fails.
        # Both of these must exit 77 (SKIP) when the model or binaries are absent, which is exactly
        # the situation on a hosted runner.
        run: |
          set -uo pipefail
          for s in scripts/turbo-quality-gate.sh tests/test-e2e-turbo-kv.sh; do
            # GitHub runs this step as `bash -e`, and `set -uo pipefail` above does not clear -e.
            # Written as `bash "$s"; rc=$?` the expected exit 77 would kill the step before rc was
            # ever read, so the only always-on job in this workflow would be permanently red.
            # `|| rc=$?` puts the call in a condition context, where -e does not fire.
            rc=0
            bash "$s" >/tmp/out 2>&1 || rc=$?
            if [ "$rc" -ne 77 ]; then
              echo "$s exited $rc, expected 77 (SKIP) with no model/binaries present:"
              tail -20 /tmp/out
              exit 1
            fi
            echo "OK: $s -> 77 SKIP"
          done

  gpu-gates:
    name: golden + e2e on Arc
    if: ${{ vars.HAS_ARC_RUNNER == 'true' }}
    runs-on: [self-hosted, windows, arc-b580]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Build (AOT bmg_g21)
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64 --force
          cmake -G Ninja -B build-ci ^
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=icx ^
            -DCMAKE_BUILD_TYPE=Release -DGGML_SYCL=ON ^
            -DGGML_SYCL_DEVICE_ARCH=bmg-g21 -DLLAMA_CURL=OFF
          cmake --build build-ci --config Release -j 8 ^
            --target llama-cli llama-bench llama-perplexity test-sycl-turbo test-sycl-turbo-hd64
          if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%

      # test-sycl-turbo-hd64 needs a head_dim-64 model and no such gguf exists to point at, so it
      # synthesizes one. This second tree is unavoidable: the generator (test-llama-archs) uses llama
      # internals that are not exported from the shared library, so it only builds with
      # BUILD_SHARED_LIBS=OFF. It is CPU-only and has no SYCL, so it is cheap next to the AOT build
      # above. Without this step the hd64 gate would exit 77 on every run - a gate that always skips
      # is a gate that does not exist, which is the exact defect the rest of this file fixes.
      - name: Synthesize the head_dim-64 model
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64 --force
          cmake -G Ninja -B build-gen ^
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl ^
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF ^
            -DGGML_SYCL=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=ON ^
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build build-gen --config Release -j 8 --target test-llama-archs
          if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%
          set LLAMA_ARCHS_N_EMBD=128
          set LLAMA_ARCHS_N_HEAD=2
          rem save_models() only concatenates dir + "/" + name; it does not create the directory.
          if not exist synth64 mkdir synth64
          build-gen\bin\test-llama-archs.exe -a llama -s 42 -o synth64
          if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%
          rem The generator can exit 0 having written nothing, so check the artifact, not the code.
          if not exist synth64\llama-dense.gguf exit /b 1

      - name: head_dim 64 turbo dispatch
        # Asserts that turbo KV on a head_dim that is not a multiple of 128 dispatches on the GPU
        # instead of silently falling back to the CPU backend (ADR-0011). A 77 here means the model
        # synthesis above produced nothing, which is a failure of this workflow, not a skip.
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          TURBO_HD64_MODEL="$PWD/synth64/llama-dense.gguf" \
            build-ci/bin/test-sycl-turbo-hd64.exe || rc=$?
          if [ "$rc" -eq 77 ]; then
            echo "::error::hd64 SKIPPED - the synthesized model is missing."
            exit 1
          fi
          exit $rc

      - name: Golden numeric parity
        # The primary gate. CPU golden vs SYCL kernel in the rotated domain.
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64 --force
          set SYCL_CACHE_PERSISTENT=1
          build-ci\bin\test-sycl-turbo.exe
          if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%

      - name: E2E coherence
        # Exit 77 means the reference model is absent on the runner. That is a real gap, not a pass,
        # so surface it loudly rather than letting the job go green on a skip.
        shell: bash
        run: |
          set -uo pipefail
          # LLAMA_CLI must be set: the build above writes to build-ci, but the script only searches
          # build-perf, build and build-sync, so without this the gate would either test a stale
          # binary left over from a previous run or skip with 77 and be reported as a missing model.
          # `|| rc=$?` because this step runs under `bash -e` and the 77 check below must be reached.
          rc=0
          LLAMA_CLI="$PWD/build-ci/bin/llama-cli.exe" \
          TURBO_E2E_MODEL="${TURBO_E2E_MODEL:-G:/models/Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf}" \
            bash tests/test-e2e-turbo-kv.sh || rc=$?
          if [ "$rc" -eq 77 ]; then
            echo "::error::e2e SKIPPED - the reference model is missing on this runner."
            exit 1
          fi
          exit $rc

  quality:
    name: perplexity budget
    # Validates perplexity budget for recommended asymmetric TurboQuant configurations vs q8_0 baseline.
    if: ${{ vars.HAS_ARC_RUNNER == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, windows, arc-b580]
    continue-on-error: true
    timeout-minutes: 240
    needs: [gpu-gates]
    steps:
      - uses: actions/checkout@v6

      # This job cannot inherit gpu-gates' build tree. `needs:` orders the jobs but shares no
      # filesystem contract, and actions/checkout above cleans untracked files from the workspace,
      # which is exactly what build-ci is. Pointing LLAMA at a build-ci that checkout just deleted
      # made the gate skip on a missing binary every single run.
      - name: Build (AOT bmg_g21)
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64 --force
          cmake -G Ninja -B build-ci ^
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=icx ^
            -DCMAKE_BUILD_TYPE=Release -DGGML_SYCL=ON ^
            -DGGML_SYCL_DEVICE_ARCH=bmg-g21 -DLLAMA_CURL=OFF
          cmake --build build-ci --config Release -j 8 ^
            --target llama-bench llama-perplexity
          if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%

      - name: Quality + speed gate
        shell: bash
        run: |
          LLAMA="$PWD/build-ci/bin" CHUNKS=32 bash scripts/turbo-quality-gate.sh
